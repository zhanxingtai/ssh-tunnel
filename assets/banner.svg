<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="ssh-tunnel — SSH 端口映射与 SOCKS5 代理管理工具">
  <title>ssh-tunnel — SSH 端口映射与 SOCKS5 代理管理工具</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f83f8"/>
      <stop offset="1" stop-color="#1d3fa8"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2742"/>
      <stop offset="1" stop-color="#18223a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#page)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- 品牌标记：与程序图标同一套图形 -->
  <g transform="translate(64,54) scale(0.171875)">
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#mark)"/>
    <path d="M 136 144 H 340 A 56 56 0 0 1 340 256 H 172 A 64 64 0 0 0 172 384 H 376" fill="none" stroke="#4ade80" stroke-opacity="0.72" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="136" cy="144" r="38" fill="#4ade80"/>
    <circle cx="376" cy="332" r="28" fill="#4ade80"/>
    <path d="M 326 414 V 390 a 30 30 0 0 1 30 -30 H 396 a 30 30 0 0 1 30 30 V 398 a 16 16 0 0 1 -16 16 H 342 a 16 16 0 0 1 -16 -16 Z" fill="#4ade80"/>
    <path d="M 208 228 a 48 48 0 0 1 96 0" fill="none" stroke="#ffffff" stroke-width="26"/>
    <path d="M 196 228 H 316 V 298 a 26 26 0 0 1 -26 26 H 222 a 26 26 0 0 1 -26 -26 Z" fill="#ffffff"/>
    <circle cx="256" cy="266" r="14" fill="#2f62d2"/>
    <rect x="249" y="266" width="14" height="38" rx="7" fill="#2f62d2"/>
  </g>

  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
    <text x="168" y="118" fill="#f2f6ff" font-size="56" font-weight="700" letter-spacing="-1">ssh-tunnel</text>
    <text x="168" y="148" fill="#6f83a6" font-size="17" letter-spacing="2">SSH TUNNEL MANAGER</text>

    <text x="64" y="212" fill="#e8eefb" font-size="27" font-weight="600">SSH 端口映射与 SOCKS5 代理管理工具</text>
    <text x="64" y="250" fill="#8ea3c6" font-size="18">先配置主机与认证信息，再配置本地转发 / 远程转发 / 动态代理三类隧道。</text>

    <g font-size="16">
      <rect x="64" y="278" width="104" height="34" rx="17" fill="url(#chip)" stroke="#2b3a5c"/>
      <text x="116" y="300" fill="#a9bde0" text-anchor="middle">本地转发</text>
      <rect x="180" y="278" width="104" height="34" rx="17" fill="url(#chip)" stroke="#2b3a5c"/>
      <text x="232" y="300" fill="#a9bde0" text-anchor="middle">远程转发</text>
      <rect x="296" y="278" width="152" height="34" rx="17" fill="url(#chip)" stroke="#2b3a5c"/>
      <text x="372" y="300" fill="#a9bde0" text-anchor="middle">SOCKS5 动态代理</text>
      <rect x="460" y="278" width="120" height="34" rx="17" fill="url(#chip)" stroke="#2b3a5c"/>
      <text x="520" y="300" fill="#a9bde0" text-anchor="middle">多主机管理</text>
    </g>
    <text x="64" y="352" fill="#5f7396" font-size="15">纯 Go 单文件 · 图形化界面 / 命令行 · 断线自动重连 · Windows 免安装</text>
  </g>

  <!-- 界面示意：按主机列出隧道 -->
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="700" y="46" width="516" height="308" rx="18" fill="#111a2e" stroke="#223050"/>
    <path d="M 718 46 h 480 a 18 18 0 0 1 18 18 v 32 h -516 v -32 a 18 18 0 0 1 18 -18 z" fill="#16223c"/>
    <circle cx="726" cy="70" r="5" fill="#3d4a66"/>
    <circle cx="744" cy="70" r="5" fill="#3d4a66"/>
    <circle cx="762" cy="70" r="5" fill="#3d4a66"/>
    <text x="784" y="76" fill="#7f93b8" font-size="15">ssh-tunnel · 隧道管理</text>

    <!-- 第一台主机：展开 -->
    <rect x="718" y="112" width="480" height="118" rx="12" fill="#0e1729" stroke="#1e2b46"/>
    <circle cx="746" cy="142" r="10" fill="#3f83f8"/>
    <text x="768" y="148" fill="#dbe6fb" font-size="17" font-weight="600">生产机</text>
    <text x="860" y="148" fill="#6f83a6" font-size="14">root@10.0.0.10:22</text>
    <rect x="1024" y="130" width="86" height="24" rx="12" fill="#1b2b4c"/>
    <text x="1067" y="147" fill="#8fd0ff" font-size="13" text-anchor="middle">本地转发 2</text>
    <rect x="1116" y="130" width="74" height="24" rx="12" fill="#1b2b4c"/>
    <text x="1153" y="147" fill="#8fd0ff" font-size="13" text-anchor="middle">SOCKS5 1</text>

    <rect x="740" y="170" width="436" height="22" rx="8" fill="#141f38"/>
    <circle cx="756" cy="181" r="5" fill="#22c55e"/>
    <text x="770" y="186" fill="#b9c8e4" font-size="14">网站</text>
    <text x="830" y="186" fill="#6f83a6" font-size="13">127.0.0.1:8080 → 127.0.0.1:80</text>
    <text x="1156" y="186" fill="#6f83a6" font-size="13" text-anchor="end">自动启动</text>

    <rect x="740" y="198" width="436" height="22" rx="8" fill="#141f38"/>
    <circle cx="756" cy="209" r="5" fill="#f59e0b"/>
    <text x="770" y="214" fill="#b9c8e4" font-size="14">代理</text>
    <text x="830" y="214" fill="#6f83a6" font-size="13">127.0.0.1:1080（动态）</text>
    <text x="1156" y="214" fill="#6f83a6" font-size="13" text-anchor="end">已连接</text>

    <!-- 其余主机 -->
    <rect x="718" y="244" width="480" height="44" rx="12" fill="#0e1729" stroke="#1e2b46"/>
    <circle cx="746" cy="266" r="10" fill="#2563eb"/>
    <text x="768" y="272" fill="#dbe6fb" font-size="17" font-weight="600">测试机</text>
    <text x="860" y="272" fill="#6f83a6" font-size="14">deploy@192.168.1.20:22</text>
    <rect x="1100" y="254" width="86" height="24" rx="12" fill="#1b2b4c"/>
    <text x="1143" y="271" fill="#8fd0ff" font-size="13" text-anchor="middle">远程转发 1</text>

    <rect x="718" y="298" width="480" height="44" rx="12" fill="#0e1729" stroke="#1e2b46"/>
    <circle cx="746" cy="320" r="10" fill="#2563eb"/>
    <text x="768" y="326" fill="#dbe6fb" font-size="17" font-weight="600">办公机</text>
    <text x="860" y="326" fill="#6f83a6" font-size="14">root@10.1.2.3:22</text>
    <rect x="1100" y="308" width="86" height="24" rx="12" fill="#1b2b4c"/>
    <text x="1143" y="325" fill="#8fd0ff" font-size="13" text-anchor="middle">本地转发 1</text>
  </g>
</svg>
